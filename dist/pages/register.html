<!DOCTYPE html>
<html lang="fa"  dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/home.css">

  <title>ثبت درخواست</title>
</head>

<body>
  <header>
    <nav class="navbar fixed">
      <div class="nav-links">
        <a href="home.html">خانه</a>
        <a href="register.html">ثبت درخواست</a>
        <a href="Log in.html">ورود</a>
        <a href="Sign up.html">ثبت نام</a>
      </div>
    </nav>
  </header>
  <main>
    <section>
      <div class="container">

         <picture class="basis-1/2 object-cover bg-cover bg-center rounded-lg">
          <img src="../../src/img/ad3ac1c75907ca7572c5473847f9f712.jpg" alt="Responsive Image">
        </picture>

        <div id="checking-user" class="max-w-lg mx-auto bg-white p-8 rounded-lg shadow-lg">

          <h2 class="text-3xl font-bold text-teal-600 text-center mb-6">درخواست خدمات</h2>

          <form id="requestForm">

            <div class="mb-6 relative">
              <input type="text" id="name" name="name"
                class="peer w-full p-4 border border-teal-400 rounded-lg focus:ring-2 focus:ring-teal-500 focus:outline-none "
                required>
              <label for="name"
                class="absolute left-4 -top-2 text-sm text-teal-600 bg-white px-2 transition-all peer-focus:text-sm peer-focus:-top-2 ">نام
                و نام خانوادگی</label>
            </div>


            <div class="mb-6 relative">
              <input type="tel" id="phone-number" name="phone-number"
                class="peer w-full p-4 border border-teal-400 rounded-lg focus:ring-2 focus:ring-teal-500 focus:outline-none text-right "
                pattern="^09\d{9}$" title="شماره تلفن باید با 09 شروع شود و شامل 11 رقم باشد" required
                oninvalid="this.setCustomValidity('شماره تلفن نامعتبر است! مثال: 09123456789')"
                oninput="this.setCustomValidity('')">
              <label for="phone-number"
                class="absolute left-4 -top-2 text-sm text-teal-600 bg-white px-2 transition-all peer-focus:text-sm peer-focus:-top-2 ">شماره
                تلفن همراه</label>
            </div>


            <div class="mb-6 relative">
              <select id="services" name="services"
                class="peer w-full p-4 border border-teal-400 rounded-lg focus:ring-2 focus:ring-teal-500 focus:outline-none"
                required>
                <option value="" disabled selected>انتخاب نوع خدمات</option>
                <option value="پرستاری سالمندان">پرستاری سالمندان</option>
                <option value="پرستاری کودکان ونوزادان">پرستاری کودکان و نوزادان</option>
                <option value="همراه بیمار در منزل و بیمارستان">همراه بیمار در منزل و بیمارستان</option>
                <option value="تزریقات و سرم‌تراپی">تزریقات و سرم‌تراپی</option>
                <option value="فیزیوتراپی و توانبخشی">فیزیوتراپی و توانبخشی</option>
              </select>
              <label for="services"
                class="absolute left-4 -top-2 text-sm text-teal-600 bg-white px-2 transition-all peer-focus:text-sm peer-focus:-top-2">خدمات
                پرستاری</label>
            </div>


            <button type="submit"
              class="w-full bg-teal-500 text-white font-bold py-4 rounded-lg hover:bg-teal-600 transition duration-300 hover:scale-105">
              ثبت درخواست
            </button>
          </form>
        </div>
        
      </div>
      </div>
    </section>
  </main>
  <script type="module" src="../js/home.bundle.js"></script>
</body>

</html>
